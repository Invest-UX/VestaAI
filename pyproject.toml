[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="vestaai-backend"
version="0.3.0"
description="VestaAI growth copilot backend"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1.0","uvicorn[standard]>=0.30,<1.0","sqlalchemy>=2.0,<3.0","psycopg[binary]>=3.2,<4.0","pydantic-settings>=2.5,<3.0","alembic>=1.13,<2.0","PyJWT[crypto]>=2.9,<3.0"]
[project.optional-dependencies]
dev=["pytest>=8.0","httpx>=0.27","ruff>=0.6"]
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
testpaths=["tests"]
markers=["postgres: requires a disposable PostgreSQL database configured via TEST_DATABASE_URL"]
