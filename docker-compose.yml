# Local development only. Use managed PostgreSQL and a separate migration release job in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vestaai
      POSTGRES_USER: vestaai
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - vestaai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vestaai -d vestaai"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      APP_ENV: development
      AUTH_MODE: development
      DATABASE_URL: postgresql+psycopg://vestaai:local-dev-only-change-me@db:5432/vestaai
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes:
  vestaai_postgres_data:
